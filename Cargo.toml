[package]
name = "piolsp"
version = "0.2.0"
edition = "2024"
description = "LSP Server for Raspberry Pi PIO assembly"
readme = "README.md"
repository = "https://github.com/nmetschke/piolsp"
license = "MIT"
keywords = ["language-server", "lsp", "pio"]

[[bench]]
harness = false
name = "lsp"

[dependencies]
foldhash = "0.2.0"
gen-lsp-types = "0.11"
log = "0.4"
lsp-server = "0.10"
memchr = "2.8"
regex = "1.13"
serde = "1.0"
serde_json = "1.0"
simple-logging = "2.0"
tree-sitter = "0.27"
tree-sitter-pio = "0.2.0"
yoke = { version = "0.8", default-features = false, features = [
  "alloc",
  "derive"
] }

[dev-dependencies]
criterion = "0.8"
pretty_assertions = "1.4"

[profile.release]
lto = "fat"
